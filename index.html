<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Dondlinger GC | Central Wisconsin General Contractor</title>
  <meta name="description" content="Dondlinger General Contracting LLC — Central Wisconsin certified dwelling contractor specializing in Drywall, Concrete Flatwork, Framing, Remodels, and Roofing across Wisconsin Rapids, Stevens Point, and Wood County.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:title" content="Dondlinger GC | Central Wisconsin General Contractor">
  <meta property="og:description" content="Drywall, Concrete Flatwork, Framing, Remodels, and Roofing. Real Wisconsin project proof, authentic jobsite videos, and transparent turnkey packages.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dondlingergc.com">
  <meta property="og:image" content="images/projects/concrete_cooper_finished.webp">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=3.0.0">
  <script src="js/app.js?v=3.0.0" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- Sticky App Header -->
    <header class="app-header">
      <div class="brand-wrap">
        <a href="#root" class="brand-name" onclick="showRootView()">
          <span>Dondlinger GC</span>
          <span class="green-dot"></span>
        </a>
        <span class="brand-territory">Central Wisconsin</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;">
        <button class="trade-pill" style="padding:5px 10px;font-size:11px;" onclick="toggleChatWindow()" aria-label="Open Live Dispatch Chat">
          <span>💬 Chat</span>
        </button>
        <a href="tel:7154593050" class="btn-header-call" aria-label="Call Dondlinger General Contracting">
          <span>📞 (715) 459-3050</span>
        </a>
      </div>
    </header>

    <!-- Dynamic Breadcrumb Navigation Bar -->
    <nav id="breadcrumb-bar" class="breadcrumb-bar" style="display:none;" aria-label="Breadcrumb Navigation"></nav>

    <!-- Main Dynamic Interactive Stage -->
    <main id="stage-view" role="main"></main>

    <!-- 3-Way Floating Dispatch Chat Launcher -->
    <div id="chat-launcher" class="chat-launcher" onclick="toggleChatWindow()" aria-label="Open 3-Way Live Dispatch Chat">
      <span class="chat-icon">💬</span>
      <span class="chat-launcher-text">Live Chat</span>
      <span class="chat-pulse-dot"></span>
    </div>

    <!-- 3-Way Live Dispatch Chat Modal / Drawer -->
    <div id="chat-modal" class="chat-modal" style="display:none;" role="dialog" aria-label="3-Way Live Dispatch Chat">
      <div class="chat-modal-header">
        <div class="chat-header-info">
          <div class="chat-header-title">
            <span>DGC 3-Way Dispatch</span>
            <span class="chat-live-badge">🟢 LIVE</span>
          </div>
          <div class="chat-header-sub">Client • DGC Dispatch • John Dondlinger (Owner)</div>
        </div>
        <button class="chat-close-btn" onclick="toggleChatWindow()" aria-label="Close Chat">✕</button>
      </div>

      <div id="chat-messages-container" class="chat-messages-container">
        <!-- Injected via app.js -->
      </div>

      <form id="chat-input-form" class="chat-input-form" onsubmit="handleChatSend(event)">
        <input type="text" id="chat-input-field" class="chat-input-field" placeholder="Ask John or team about your project..." autocomplete="off" required>
        <button type="submit" id="chat-send-btn" class="chat-send-btn" aria-label="Send Message">
          <span>➤</span>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
