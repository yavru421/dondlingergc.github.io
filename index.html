<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Dondlinger Digital Database — Engineering Division. Premium progressive web applications.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="dondlinger_logo.png">
  <title>Dondlinger Digital Database</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-panel: #0a0a0a;
      --border: #333333;
      --text-main: #ffffff;
      --text-dim: #888888;
      --accent: #39ff14;
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Side Nav */
    #sidebar {
      width: 280px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 2px solid transparent;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      background-color: rgba(255,255,255,0.05);
      border-left: 2px solid var(--accent);
    }

    .special-link {
      margin-top: auto;
      background: rgba(57, 255, 20, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      text-align: center;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .special-link:hover {
      background: var(--accent);
      color: #000;
    }

    /* Main Area */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Header & Search */
    header {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .search-wrap {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 16px 24px;
      font-size: 1.1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Grid */
    .catalog-container {
      padding: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      background: var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--text-dim);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .app-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .app-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      color: var(--text-dim);
    }

    .card-desc {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .who-pill {
      font-size: 0.75rem;
      background: var(--bg-base);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 12px;
      color: var(--text-dim);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 16px; }
      .special-link { margin-top: 24px; }
      header { padding: 16px; }
      .catalog-container { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Nav -->
  <nav id="sidebar">
    <div class="brand">Dondlinger Digital</div>
    <div class="brand-sub">ZLA Architecture Hub</div>

    <div class="nav-label">Directory</div>
    <div class="nav-link active" data-category="All" onclick="filterCategory('All')">All Applications</div>
    <div class="nav-link" data-category="Platform" onclick="filterCategory('Platform')">Platform Core</div>
    <div class="nav-link" data-category="Client Services" onclick="filterCategory('Client Services')">Client Services</div>
    
    <a href="./dondlingerdigitaldatabase/index.html#oracle-game" class="special-link">
      > Launch Neural Oracle 20Q
    </a>
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <header>
      <div class="search-wrap">
        <input type="text" id="searchBar" class="search-input" placeholder="Search applications, tags, or features..." oninput="handleSearch()">
      </div>
    </header>

    <div class="catalog-container">
      <div class="section-title">
        <span id="current-category">All Applications</span>
        <span class="section-count" id="app-count">0</span>
      </div>
      <div class="app-grid" id="appGrid">
        <!-- Cards injected via JS -->
      </div>
    </div>
  </main>

  <script>
    let appsData = {};
    let currentCategory = 'All';

    // Fetch static JSON
    fetch('data/apps.json')
      .then(res => res.json())
      .then(data => {
        appsData = data;
        renderGrid();
      })
      .catch(err => console.error("Error loading apps.json:", err));

    function renderGrid(searchQuery = '') {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';
      let count = 0;

      const q = searchQuery.toLowerCase();

      for (const [key, app] of Object.entries(appsData)) {
        // Filter by category
        if (currentCategory !== 'All' && app.category !== currentCategory) continue;

        // Filter by search query
        const matchStr = `${app.title} ${app.desc} ${app.who ? app.who.join(' ') : ''} ${app.category}`.toLowerCase();
        if (q && !matchStr.includes(q)) continue;

        count++;

        // Render card
        const card = document.createElement('a');
        card.className = 'app-card';
        card.href = app.link;
        if(app.link.startsWith('http')) card.target = '_blank';
        
        let whoHtml = '';
        if (app.who && app.who.length > 0) {
           // just show the first 2 who pills to keep it clean
           app.who.slice(0,2).forEach(w => {
             whoHtml += `<span class="who-pill">${w}</span>`;
           });
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title" style="color: ${app.accent || 'inherit'}">${app.title.split('//')[0].trim()}</div>
            <div class="card-tag">${app.category || 'App'}</div>
          </div>
          <div class="card-desc">${app.desc}</div>
          <div class="card-footer">
            ${whoHtml}
          </div>
        `;
        grid.appendChild(card);
      }

      document.getElementById('app-count').innerText = count;
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.getElementById('current-category').innerText = cat === 'All' ? 'All Applications' : cat;
      
      // Update active state
      document.querySelectorAll('.nav-link').forEach(el => {
        if (el.dataset.category === cat) el.classList.add('active');
        else el.classList.remove('active');
      });

      renderGrid(document.getElementById('searchBar').value);
    }

    function handleSearch() {
      renderGrid(document.getElementById('searchBar').value);
    }
  </script>
</body>
</html>
