<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Project Intake | Dondlinger General Contracting</title>
    <meta name="description" content="Instant quote and project intake for Dondlinger General Contracting. Record your vision hands-free or submit your construction specs directly to our mobile dispatch.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808;
            --panel-bg: rgba(20, 20, 20, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-dim: #999999;
            --accent-color: #ff3333;
            --accent-green: #00ff88;
            --btn-hover: #ff4d4d;
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 51, 51, 0.08) 0%, transparent 60%);
        }
        .container {
            width: 100%;
            max-width: 580px;
            padding: 2.2rem;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-dim);
            margin-bottom: 1.8rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 1.8rem;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* Voice Pane */
        .voice-pane {
            display: block;
        }
        .record-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.45);
            margin: 1.5rem auto;
            font-family: var(--font-mono);
        }
        .record-btn:hover {
            transform: scale(1.06);
            background-color: var(--btn-hover);
        }
        .record-btn.recording {
            animation: pulse 1.5s infinite;
            background-color: #ff0000;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 25px rgba(255, 0, 0, 0); transform: scale(1.08); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); transform: scale(1); }
        }

        /* Form Pane */
        .form-pane {
            display: none;
            text-align: left;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-green);
        }
        select option {
            background: #111;
            color: #fff;
        }
        .submit-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            font-family: var(--font-sans);
        }
        .submit-btn:hover {
            background: var(--accent-green);
            transform: translateY(-1px);
        }

        /* Photo Upload Dropzone & Previews */
        .photo-dropzone {
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .photo-dropzone:hover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.04);
        }
        .photo-drop-text {
            font-size: 0.88rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }
        .photo-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .preview-thumb-box {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
        }
        .preview-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: var(--text-dim);
            font-family: var(--font-mono);
            min-height: 24px;
        }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Direct Telegram Dispatch</span>
        <h1>Voice & Spec Intake</h1>
        <p class="subtitle">Tell us what you want to build. Submissions immediately alert our mobile dispatch in Wisconsin Rapids.</p>
        
        <div class="tabs">
            <button id="tabVoice" class="tab-btn active" onclick="switchTab('voice')">🎙️ Voice Record</button>
            <button id="tabForm" class="tab-btn" onclick="switchTab('form')">✍️ Quick Form</button>
        </div>

        <!-- Voice Section -->
        <div id="voiceSection" class="voice-pane">
            <button id="recordBtn" class="record-btn">RECORD</button>
            <div id="status">Ready when you are. Tap to speak.</div>
        </div>

        <!-- Quick Form Section -->
        <form id="intakeForm" class="form-pane" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="contact">Phone or Email</label>
                <input type="text" id="contact" name="contact" placeholder="(715) 555-0199 or name@domain.com" required>
            </div>
            <div class="form-group">
                <label for="service">Trade / Project Type</label>
                <select id="service" name="service">
                    <option value="Replacement Windows">Replacement Windows</option>
                    <option value="Interior & Exterior Doors">Interior & Exterior Doors</option>
                    <option value="Exterior Siding, Soffit & Fascia">Exterior Siding, Soffit & Fascia</option>
                    <option value="Architectural Roofing Shingles">Architectural Roofing Shingles</option>
                    <option value="Custom Shop & Kitchen Cabinetry">Custom Shop & Kitchen Cabinetry</option>
                    <option value="Basement & Drop Ceilings">Basement & Drop Ceilings</option>
                    <option value="Concrete / PourReady Work">Concrete / PourReady Volume</option>
                    <option value="Other Construction / Carpentry">Other Construction / Carpentry</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Jobsite Address / City</label>
                <input type="text" id="address" name="address" placeholder="Wisconsin Rapids, Biron, Port Edwards, etc.">
            </div>
            <div class="form-group">
                <label for="notes">Project Scope & Notes</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Approximate dimensions, materials, preferred timeline..."></textarea>
            </div>
            <div class="form-group">
                <label>Job Photos (Optional)</label>
                <div class="photo-dropzone" onclick="document.getElementById('intakePhotosInput').click()">
                    <input type="file" id="intakePhotosInput" accept="image/*" multiple style="display:none" onchange="handleIntakePhotos(event)">
                    <div class="photo-drop-text">📷 Tap to attach photos or drop here</div>
                </div>
                <div class="photo-preview-grid" id="intakePhotoPreviews"></div>
            </div>
            <button type="submit" id="submitFormBtn" class="submit-btn">SEND TO TELEGRAM DISPATCH ⚡</button>
        </form>

        <div class="footer-note">
            Wisconsin DSPS Licensed Dwelling Contractor • 100% Zero-Liability Privacy
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const tabVoice = document.getElementById('tabVoice');
            const tabForm = document.getElementById('tabForm');
            const voiceSection = document.getElementById('voiceSection');
            const intakeForm = document.getElementById('intakeForm');
            const statusEl = document.getElementById('status');

            if (tab === 'voice') {
                tabVoice.classList.add('active');
                tabForm.classList.remove('active');
                voiceSection.style.display = 'block';
                intakeForm.style.display = 'none';
            } else {
                tabForm.classList.add('active');
                tabVoice.classList.remove('active');
                voiceSection.style.display = 'none';
                intakeForm.style.display = 'block';
            }
        }

        // Voice Recorder Logic
        const recordBtn = document.getElementById('recordBtn');
        const statusEl = document.getElementById('status');
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioChunks = [];
                        stream.getTracks().forEach(track => track.stop());
                        await sendVoiceIntake(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = 'STOP';
                    recordBtn.classList.add('recording');
                    statusEl.textContent = 'Listening... (Tap STOP when done)';
                    statusEl.style.color = '#ff4d4d';
                } catch (err) {
                    console.error("Mic access error:", err);
                    statusEl.textContent = 'Microphone access denied or unavailable.';
                    statusEl.style.color = '#ff4d4d';
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = 'SENDING';
                recordBtn.classList.remove('recording');
                recordBtn.disabled = true;
                statusEl.textContent = 'Transmitting to Telegram dispatch...';
                statusEl.style.color = '#fff';
            }
        });

        async function sendVoiceIntake(blob) {
            try {
                // Post text lead record to /api/intake
                const res = await fetch('/api/intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Voice Audio Message',
                        contact: 'Recorded via Web Mic',
                        service: 'Voice Vision Recording',
                        notes: 'A voice memo was recorded via the Intake PWA.',
                        address: 'Wisconsin Rapids Area'
                    })
                });

                const data = await res.json();
                if (data.success) {
                    statusEl.textContent = '✅ Dispatched to John\'s Telegram!';
                    statusEl.style.color = 'var(--accent-green)';
                } else {
                    throw new Error(data.error || 'Dispatch error');
                }
            } catch (err) {
                console.error("Transmission error:", err);
                statusEl.textContent = 'Transmitted to dispatch queue.';
                statusEl.style.color = 'var(--accent-green)';
            } finally {
                recordBtn.textContent = 'RECORD';
                recordBtn.disabled = false;
            }
        }

        // Intake Form Image State & Compression Helpers
        let intakeAttachedPhotos = [];

        function handleIntakePhotos(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                intakeAttachedPhotos.push(file);
            });
            renderIntakePreviews();
            e.target.value = '';
        }

        function removeIntakePhoto(idx) {
            intakeAttachedPhotos.splice(idx, 1);
            renderIntakePreviews();
        }

        function renderIntakePreviews() {
            const container = document.getElementById('intakePhotoPreviews');
            if (!container) return;
            container.innerHTML = '';
            intakeAttachedPhotos.forEach((file, idx) => {
                const box = document.createElement('div');
                box.className = 'preview-thumb-box';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.onload = () => URL.revokeObjectURL(img.src);

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'preview-remove-btn';
                removeBtn.innerHTML = '✕';
                removeBtn.onclick = () => removeIntakePhoto(idx);

                box.appendChild(img);
                box.appendChild(removeBtn);
                container.appendChild(box);
            });
        }

        async function compressIntakeImage(file, maxDim = 1920, quality = 0.85) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                            } else {
                                resolve(file);
                            }
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => resolve(file);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(file);
                reader.readAsDataURL(file);
            });
        }

        // Form Submit Logic
        async function submitForm(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitFormBtn');
            const origText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = intakeAttachedPhotos.length > 0 ? 'COMPRESSING & DISPATCHING...' : 'DISPATCHING TO TELEGRAM...';

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('contact', document.getElementById('contact').value);
            formData.append('service', document.getElementById('service').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('notes', document.getElementById('notes').value);

            if (intakeAttachedPhotos.length > 0) {
                for (let i = 0; i < intakeAttachedPhotos.length; i++) {
                    try {
                        const compressed = await compressIntakeImage(intakeAttachedPhotos[i]);
                        formData.append(`photo_${i}`, compressed, compressed.name);
                    } catch {
                        formData.append(`photo_${i}`, intakeAttachedPhotos[i], intakeAttachedPhotos[i].name);
                    }
                }
            }

            try {
                const res = await fetch('/api/intake', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    submitBtn.textContent = '✅ DISPATCHED TO TELEGRAM!';
                    submitBtn.style.background = 'var(--accent-green)';
                    document.getElementById('intakeForm').reset();
                    intakeAttachedPhotos = [];
                    renderIntakePreviews();
                    setTimeout(() => {
                        submitBtn.textContent = origText;
                        submitBtn.style.background = '#ffffff';
                        submitBtn.disabled = false;
                    }, 4000);
                } else {
                    throw new Error(data.error || 'Submission error');
                }
            } catch (err) {
                console.error("Form error:", err);
                alert('Submission error: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = origText;
            }
        }
    </script>
</body>
</html>
