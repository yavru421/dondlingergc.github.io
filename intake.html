<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake | Dondlinger Digital</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ff3333;
            --btn-hover: #ff4d4d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .record-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            margin: 0 auto;
        }
        .record-btn:hover {
            transform: scale(1.05);
            background-color: var(--btn-hover);
        }
        .record-btn.recording {
            animation: pulse 1.5s infinite;
            background-color: #ff0000;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 30px rgba(255, 0, 0, 0); transform: scale(1.1); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); transform: scale(1); }
        }
        #status {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: #888;
            height: 24px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voice Your Vision</h1>
        <p>Forget the forms. Tap the button, allow microphone access, and just tell me what you want to build.</p>
        
        <button id="recordBtn" class="record-btn">RECORD</button>
        
        <div id="status">Ready when you are.</div>
    </div>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const statusEl = document.getElementById('status');
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // Start Recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioChunks = [];
                        
                        // Stop tracks to release mic
                        stream.getTracks().forEach(track => track.stop());
                        
                        await uploadAudio(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = 'STOP';
                    recordBtn.classList.add('recording');
                    statusEl.textContent = 'Listening... (Tap to stop & send)';
                } catch (err) {
                    console.error("Mic access error:", err);
                    statusEl.textContent = 'Microphone access denied or failed.';
                    statusEl.style.color = 'var(--accent-color)';
                }
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = 'SENDING';
                recordBtn.classList.remove('recording');
                recordBtn.disabled = true;
                statusEl.textContent = 'Uploading your vision...';
            }
        });

        async function uploadAudio(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'vision.webm');

            try {
                // Endpoint will be the deployed worker URL
                const response = await fetch('https://intake-api.dondlingergeneralcontracting.workers.dev/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusEl.textContent = 'Success! Your vision was securely transmitted.';
                    statusEl.style.color = '#00ff88';
                } else {
                    const err = await response.json();
                    throw new Error(err.error || 'Upload failed');
                }
            } catch (err) {
                console.error("Upload error:", err);
                statusEl.textContent = 'Error uploading. Please try again.';
                statusEl.style.color = 'var(--accent-color)';
            } finally {
                recordBtn.textContent = 'RECORD';
                recordBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
