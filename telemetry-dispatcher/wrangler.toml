name = "wazeecha-telemetry-dispatcher"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wazeecha_telemetry_db"
database_id = "YOUR_D1_DATABASE_ID"

# -----------------------------------------------------------
# SECRETS MANAGEMENT (REQUIRED FOR ENTERPRISE PUSH DISPATCH)
# -----------------------------------------------------------
# Do not store your VAPID_PRIVATE_KEY in plaintext.
# You MUST inject it securely into Cloudflare using the CLI before deploy:
# 
# npx wrangler secret put VAPID_PRIVATE_KEY
# -----------------------------------------------------------

